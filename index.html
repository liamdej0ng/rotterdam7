<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Rotterdam VII</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Rotterdam VII – een open-wereld game in Rotterdam. Early Access, gratis te downloaden voor Windows.">
<meta property="og:title" content="Rotterdam VII">
<meta property="og:description" content="Alles kan kapot. Early Access – gratis voor Windows.">
<meta property="og:image" content="https://liamdej0ng.github.io/rotterdam7/media/brug.jpg">
<link rel="icon" href="favicon.png">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-800.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--ink:#0b0716;--navy:#120b2a;--purple:#3b1a6e;--pink:#ff4f8b;--orange:#ff9a4a;--gold:#ffd23a;--red:#c8102e;--txt:#f4eefc}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);font:400 17px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.display{font-family:Anton,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.01em;line-height:.9;text-transform:uppercase}
nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:28px;padding:16px 4vw;transition:background .3s,backdrop-filter .3s}
nav.solid{background:rgba(11,7,22,.82);backdrop-filter:blur(12px)}
.brand{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.04em;white-space:nowrap}.brand span{color:var(--red)}
nav .links{display:flex;gap:24px;margin-left:auto;font:800 13px Inter;letter-spacing:.14em;text-transform:uppercase}
nav .links a{opacity:.75;transition:opacity .2s}nav .links a:hover{opacity:1}
.langs{display:flex;gap:4px}.langs button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 8px;font:800 11px Inter;cursor:pointer}.langs button.on{background:var(--gold);border-color:var(--gold);color:#111}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font:800 14px Inter;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border:0;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:#140e02;box-shadow:0 10px 40px rgba(255,210,58,.35)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
nav .btn{padding:10px 18px;font-size:12px}
.hero{position:relative;height:100vh;min-height:620px;display:flex;align-items:flex-end;overflow:hidden}
.hero video,.hero .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,22,.35) 0%,rgba(11,7,22,0) 30%,rgba(59,26,110,.25) 60%,var(--ink) 100%)}
.hero .inner{position:relative;z-index:2;padding:0 4vw 9vh;width:100%}
.logo{font-size:clamp(78px,15vw,230px);text-shadow:0 8px 40px rgba(0,0,0,.45)}
.logo span{color:var(--red);-webkit-text-stroke:3px #fff;paint-order:stroke fill}
.tag{margin:14px 0 28px;font:800 clamp(16px,2vw,22px) Inter;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
.badge{display:inline-block;margin-bottom:18px;padding:6px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);font:800 12px Inter;letter-spacing:.2em;text-transform:uppercase;background:rgba(0,0,0,.35)}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.scroll{position:absolute;z-index:2;bottom:24px;left:50%;transform:translateX(-50%);font:800 11px Inter;letter-spacing:.3em;opacity:.6;animation:bob 2s infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}
section{position:relative;padding:14vh 4vw}
.kicker{font:800 13px Inter;letter-spacing:.35em;text-transform:uppercase;color:var(--pink);margin-bottom:14px}
h2.display{font-size:clamp(56px,9vw,140px);margin-bottom:28px}
.lead{max-width:640px;font-size:clamp(17px,1.4vw,20px);opacity:.85}
#trailer{background:radial-gradient(ellipse at 50% 0%,rgba(255,79,139,.18),transparent 60%),var(--ink)}
.player{position:relative;margin-top:40px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);aspect-ratio:16/9;background:#000}
.player video{width:100%;height:100%;object-fit:cover}
#personages{padding:0}
.char{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.char img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.char::after{content:"";position:absolute;inset:0}
.char.l::after{background:linear-gradient(90deg,rgba(11,7,22,.95) 0%,rgba(11,7,22,.65) 38%,rgba(11,7,22,0) 70%)}
.char.r::after{background:linear-gradient(270deg,rgba(11,7,22,.95) 0%,rgba(11,7,22,.65) 38%,rgba(11,7,22,0) 70%)}
.char .txt{position:relative;z-index:2;max-width:520px;padding:0 4vw}
.char.r .txt{margin-left:auto}
.char .name{font-size:clamp(70px,10vw,160px)}
.char.l .name{color:var(--orange)}.char.r .name{color:var(--pink)}
.quote{margin:22px 0;font:800 20px Inter;color:var(--gold)}
#stad{background:linear-gradient(180deg,var(--ink),var(--navy) 50%,var(--ink))}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:50px}
.tile{position:relative;border-radius:16px;overflow:hidden;min-height:300px;background:#222}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.tile:hover img{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,7,22,.9))}
.tile .cap{position:absolute;z-index:2;left:22px;bottom:18px;right:22px}
.tile .cap b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;text-transform:uppercase}
.tile .cap span{font-size:14px;opacity:.8}
.t1{grid-column:span 7;min-height:440px}.t2{grid-column:span 5;min-height:440px}.t3{grid-column:span 4}.t4{grid-column:span 4}.t5{grid-column:span 4}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:50px}
.feat{padding:28px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08)}
.feat i{font-style:normal;font-size:34px}.feat h3{margin:12px 0 6px;font:800 18px Inter;letter-spacing:.04em}.feat p{font-size:15px;opacity:.75}
#unreal{background:radial-gradient(ellipse at 20% 30%,rgba(25,200,255,.12),transparent 55%),linear-gradient(180deg,var(--ink),#0d1430 60%,var(--ink))}
#download{text-align:center;overflow:hidden;background:var(--ink)}
#download::before{content:"";position:absolute;inset:0;background:url(media/brug.jpg) center/cover;opacity:.35;filter:saturate(1.2)}
#download::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(59,26,110,.35),var(--ink) 75%)}
#download>*{position:relative;z-index:2}
#download h2{margin-bottom:12px}
.ver{margin:8px 0 34px;opacity:.7;font-size:14px;letter-spacing:.1em}
.steps{max-width:620px;margin:30px auto 0;font-size:15px;opacity:.8}
.req{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:26px;font-size:13px;letter-spacing:.08em;opacity:.65;text-transform:uppercase}
.disc{margin-top:50px}.disc a{display:inline-flex;gap:10px;align-items:center;padding:12px 24px;border-radius:12px;background:#5865f2;font-weight:800}.disc p{margin-top:10px;font-size:14px;opacity:.8}
footer{padding:60px 4vw 50px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
footer b{display:block;font-size:17px;letter-spacing:.04em}
.dev{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;background:rgba(255,210,58,.12);border:1px solid var(--gold);color:var(--gold);font:800 12px Inter;letter-spacing:.18em;text-transform:uppercase}
footer p{max-width:520px;margin:14px auto 0;font-size:14px;opacity:.6}
footer small{display:block;margin-top:24px;opacity:.4;font-size:12px}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s}.rv.in{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:4vw}.modal.on{display:flex}
.modal video{width:min(1400px,100%);border-radius:12px}
.modal .x{position:absolute;top:20px;right:26px;font:800 30px Inter;cursor:pointer;background:none;border:0;color:#fff}
#verhaal{background:radial-gradient(ellipse at 80% 20%,rgba(255,154,74,.12),transparent 55%),var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}
.act{padding:30px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08)}
.act em{font:400 48px Anton,Impact,sans-serif;font-style:normal;color:var(--pink);opacity:.9}.act h3{margin:6px 0 10px;font:800 19px Inter}.act p{font-size:15px;opacity:.8}
.finale{margin-top:40px;padding:34px;border-radius:18px;background:linear-gradient(120deg,rgba(255,79,139,.14),rgba(255,210,58,.1));border:1px solid rgba(255,210,58,.25);text-align:center}
.choices{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.choice{flex:1;min-width:220px;max-width:380px;padding:20px;border-radius:14px;background:rgba(0,0,0,.35)}.choice b{display:block;font:400 34px Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}.choice span{font-size:15px;opacity:.8}
.choice.c1 b{color:#5cf08a}.choice.c2 b{color:#ff5a5f}.or{font:400 28px Anton,Impact,sans-serif;opacity:.6}
.finale small{opacity:.6;font-size:13px}
#cast{background:linear-gradient(180deg,var(--ink),#160d30 60%,var(--ink))}
.castgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
.cc{position:relative;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;border-radius:18px;overflow:hidden;aspect-ratio:3/4.2;background:radial-gradient(circle at 50% 35%,var(--c) 0%,rgba(0,0,0,0) 62%),linear-gradient(180deg,#221640,#0f0a20);box-shadow:0 0 0 1px rgba(255,255,255,.08);transition:transform .25s,box-shadow .25s}
.cc:hover,.cc:focus-visible{transform:translateY(-6px);box-shadow:0 0 0 2px var(--c),0 30px 60px rgba(0,0,0,.5);outline:none}
.cc img{position:absolute;left:50%;bottom:0;height:92%;width:auto;max-width:none;transform:translateX(-50%);transition:transform .35s}
.cc:hover img{transform:translateX(-50%) scale(1.04)}
.cc .lab{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 16px;background:linear-gradient(180deg,transparent,rgba(11,7,22,.95))}
.cc .lab b{display:block;font:400 30px Anton,Impact,sans-serif;text-transform:uppercase;line-height:1}.cc .lab span{font-size:13px;opacity:.75}
.cc .more{position:absolute;top:14px;right:14px;font:800 11px Inter;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}.cc:hover .more{opacity:1}
.cmodal{position:fixed;inset:0;z-index:90;background:rgba(5,3,10,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:3vw}.cmodal.on{display:flex}
.cbox{position:relative;width:min(1100px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(260px,38%) 1fr;border-radius:20px;background:#120b26;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.6)}
.cart{position:relative;min-height:520px;background:radial-gradient(circle at 50% 40%,var(--c),transparent 65%),linear-gradient(180deg,#24174a,#0f0a20)}
.cart img{position:absolute;left:50%;bottom:0;height:94%;width:auto;max-width:none;transform:translateX(-50%)}
.cinfo{padding:40px 40px 34px}.cinfo h3{font:400 clamp(48px,6vw,84px)/.9 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--c)}
.cinfo .role{margin:10px 0 16px;font:800 14px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.facts span{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px}
.cinfo .q{font:800 19px Inter;color:var(--gold);margin-bottom:16px}
.cinfo p{opacity:.85;font-size:16px}
.cinfo .lk{margin:18px 0;padding:14px 16px;border-left:3px solid var(--c);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;font-size:15px}
.cinfo .lk b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.cinfo h4{margin:22px 0 10px;font:800 12px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--pink)}
.ms{display:grid;gap:8px}.ms div{padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}.ms b{display:block;font-size:15px}
.secret{margin-top:18px;font-size:13px;opacity:.6}
.cmodal .x{position:absolute;top:14px;right:18px;z-index:3;font:800 26px Inter;cursor:pointer;background:none;border:0;color:#fff}
@media (max-width:900px){
 h2.display{font-size:clamp(40px,11.5vw,140px);overflow-wrap:anywhere}
 .choices{flex-direction:column}.choice{width:100%;max-width:none}
 .acts{grid-template-columns:1fr}.castgrid{grid-template-columns:repeat(2,1fr);gap:12px}.cc .lab b{font-size:24px}
 .cbox{grid-template-columns:1fr}.cart{min-height:340px}.cinfo{padding:26px 22px}
}
@media (max-width:900px){
 nav .links{display:none}nav{gap:12px}nav .langs{margin-left:auto}
 .grid{grid-template-columns:1fr}.t1,.t2,.t3,.t4,.t5{grid-column:auto;min-height:260px}
 .char{min-height:85vh;align-items:flex-end;padding-bottom:8vh}
 .char.l::after,.char.r::after{background:linear-gradient(180deg,rgba(11,7,22,0) 30%,rgba(11,7,22,.95) 85%)}
 .char.r .txt{margin-left:0}
 .char{display:block;min-height:0;padding:0}
 .char img{position:relative;height:62vh;object-position:var(--pos,50%) center}
 .char.l img{--pos:68%}.char.r img{--pos:32%}
 .char.l::after,.char.r::after{display:none}
 .char .txt{padding:24px 6vw 60px;max-width:none}
}
@media (max-width:520px){
 .brand{font-size:20px;white-space:nowrap}
 nav .btn{display:none}
}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.scroll{animation:none}}
</style>
</head>
<body>
<nav id="nav">
  <a class="brand" href="#top">ROTTERDAM <span>VII</span></a>
  <div class="links"><a href="#trailer" data-t="navTrailer"></a><a href="#verhaal" data-t="navStory"></a><a href="#personages" data-t="navChars"></a><a href="#stad" data-t="navCity"></a><a href="#features" data-t="navFeat"></a></div>
  <div class="langs"><button data-l="nl">NL</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
  <a class="btn gold dl" href="#download" data-t="navDl"></a>
</nav>
<header class="hero" id="top">
  <img class="still" src="media/brug.jpg" alt="">
  <video autoplay muted loop playsinline preload="auto" poster="media/brug.jpg"><source src="media/hero.mp4" type="video/mp4"></video>
  <div class="inner">
    <div class="badge" data-t="badge"></div>
    <h1 class="display logo">ROTTERDAM <span>VII</span></h1>
    <div class="tag" data-t="tag"></div>
    <div class="cta">
      <button class="btn ghost" id="watch" data-t="watch"></button>
      <a class="btn gold dl" href="#download" data-t="dlFree"></a>
    </div>
  </div>
  <div class="scroll">SCROLL ↓</div>
</header>
<section id="trailer">
  <div class="kicker rv" data-t="trK"></div>
  <h2 class="display rv" data-t="trH"></h2>
  <div class="player rv"><video controls preload="metadata" poster="media/trailer-poster.jpg"><source src="media/trailer.mp4" type="video/mp4"></video></div>
</section>
<section id="verhaal">
  <div class="kicker rv" data-t="verK"></div>
  <h2 class="display rv">Container <span style="color:var(--gold)">VII-007</span></h2>
  <p class="lead rv" data-t="verIntro"></p>
  <div class="acts">
    <div class="act rv"><em>01</em><h3 data-t="a1T"></h3><p data-t="a1"></p></div>
    <div class="act rv"><em>02</em><h3 data-t="a2T"></h3><p data-t="a2"></p></div>
    <div class="act rv"><em>03</em><h3 data-t="a3T"></h3><p data-t="a3"></p></div>
  </div>
  <div class="finale rv"><div class="kicker" data-t="finT"></div>
    <div class="choices"><div class="choice c1"><b data-t="f1T"></b><span data-t="fin1"></span></div><div class="or" data-t="or"></div><div class="choice c2"><b data-t="f2T"></b><span data-t="fin2"></span></div></div>
    <small data-t="verNote"></small></div>
</section>
<section id="personages">
  <div class="char l">
    <img src="media/barry.jpg" alt="Barry Boem" loading="lazy">
    <div class="txt rv">
      <div class="kicker" data-t="c1K"></div>
      <h2 class="display name">Barry<br>Boem</h2>
      <p class="lead" data-t="c1"></p>
      <div class="quote" data-t="c1Q"></div>
    </div>
  </div>
  <div class="char r">
    <img src="media/bella.jpg" alt="Bella Boem" loading="lazy">
    <div class="txt rv">
      <div class="kicker" data-t="c2K"></div>
      <h2 class="display name">Bella<br>Boem</h2>
      <p class="lead" data-t="c2"></p>
      <div class="quote" data-t="c2Q"></div>
    </div>
  </div>
</section>
<section id="cast">
  <div class="kicker rv" data-t="castK"></div>
  <h2 class="display rv" data-t="castH"></h2>
  <p class="lead rv" data-t="cast"></p>
  <div class="castgrid" id="castgrid"></div>
</section>
<section id="stad">
  <div class="kicker rv" data-t="cityK"></div>
  <h2 class="display rv" data-t="cityH"></h2>
  <p class="lead rv" data-t="city"></p>
  <div class="grid">
    <div class="tile t1 rv"><img src="media/aerial.jpg" alt="" loading="lazy"><div class="cap"><b data-t="p1"></b><span data-t="p1s"></span></div></div>
    <div class="tile t2 rv"><img src="media/maastoren.jpg" alt="" loading="lazy"><div class="cap"><b>Maastoren</b><span data-t="p2s"></span></div></div>
    <div class="tile t3 rv"><img src="media/kubus.jpg" alt="" loading="lazy"><div class="cap"><b>Kantelhuizen</b><span data-t="p3s"></span></div></div>
    <div class="tile t4 rv"><img src="media/brug.jpg" alt="" loading="lazy"><div class="cap"><b>Zwanenbrug</b><span data-t="p4s"></span></div></div>
    <div class="tile t5 rv"><img src="media/nacht.jpg" alt="" loading="lazy"><div class="cap"><b data-t="p5"></b><span data-t="p5s"></span></div></div>
  </div>
</section>
<section id="features">
  <div class="kicker rv" data-t="fK"></div>
  <h2 class="display rv" data-t="fH"></h2>
  <div class="feats">
    <div class="feat rv"><i>⭐</i><h3 data-t="f1"></h3><p data-t="f1p"></p></div>
    <div class="feat rv"><i>📻</i><h3 data-t="f2"></h3><p data-t="f2p"></p></div>
    <div class="feat rv"><i>🔧</i><h3 data-t="f3"></h3><p data-t="f3p"></p></div>
    <div class="feat rv"><i>🌧️</i><h3 data-t="f4"></h3><p data-t="f4p"></p></div>
    <div class="feat rv"><i>📱</i><h3 data-t="f5"></h3><p data-t="f5p"></p></div>
    <div class="feat rv"><i>🌍</i><h3 data-t="f6"></h3><p data-t="f6p"></p></div>
  </div>
</section>
<section id="unreal">
  <div class="kicker rv" data-t="ueK"></div>
  <h2 class="display rv">Unreal Engine <span style="color:var(--gold)">5</span></h2>
  <span class="dev rv" style="margin-bottom:22px" data-t="ueBadge"></span>
  <p class="lead rv" data-t="ue"></p>
  <div class="feats">
    <div class="feat rv"><i>🧍</i><h3 data-t="ue1"></h3><p data-t="ue1p"></p></div>
    <div class="feat rv"><i>🌆</i><h3 data-t="ue2"></h3><p data-t="ue2p"></p></div>
    <div class="feat rv"><i>📦</i><h3 data-t="ue3"></h3><p data-t="ue3p"></p></div>
    <div class="feat rv"><i>🎮</i><h3 data-t="ue4"></h3><p data-t="ue4p"></p></div>
  </div>
</section>
<section id="download">

nl:{ueK:'Wat komt er',ueBadge:'In ontwikkeling',ue:'Liam & Tim bouwen Rotterdam VII opnieuw op in Unreal Engine 5. Met realistische graphics, dezelfde personages en het verhaal rond container VII-007. De huidige versie blijft gewoon speelbaar en krijgt ook updates.',ue1:'Realistische personages',ue1p:'Barry, Bella en de rest, nagebouwd als echte mensen.',ue2:'Een levende stad',ue2p:'Realistisch licht, weer en dag en nacht.',ue3:'Hetzelfde verhaal',ue3p:'Container VII-007, 24 missies en jouw keuze in de finale.',ue4:'Blijf spelen',ue4p:'De versie van nu blijft hier te downloaden.',navStory:'Verhaal',verK:'Het verhaal',verIntro:'Op een regenachtige avond verdwijnt container VII-007 uit een beveiligde haven. Volgens de autoriteiten is het een administratieve fout. In werkelijkheid zitten er geheime documenten in, miljoenen euro’s aan zwart geld en bewijs van corruptie in het stadsbestuur. En die verdwijning verbindt acht Rotterdammers die allemaal iets te verbergen hebben.',
 a1T:'Verdwijning',a1:'Ome Kees herkent de sporen van zijn oude netwerk. Barry krijgt een verdachte sloopopdracht, Boer Gerrit reed een deel van het transport en Haringman Henk krijgt een geheugenstick in handen. Toeval? Echt niet.',
 a2T:'Iedereen heeft iets te verbergen',a2:'Bella ruikt haar grote kans. Fenna brengt het corrupte netwerk in kaart. Agent Bram ontdekt dat de politie zelf betrokken is, en Handhaver Ilse ziet bij een gewone controle iets wat niet klopt.',
 a3T:'Bondgenoten of verraders',a3:'Alle puzzelstukjes samen zijn de sleutel tot de waarheid. Jij moet bewijs veiligstellen, rivalen overleven en kiezen wie je vertrouwt.',

 cityK:'De stad',cityH:'Jouw Rotterdam',city:'Rij door een open wereld vol hoge torens, kantelhuizen, bruggen en havens. Van zonsopgang tot een stad vol lichtjes in de nacht: je kunt overal heen.',

 dK:'Download',dH:'Speel het nu',dlWin:'⬇ Download voor Windows',ver:'Versie ',

en:{ueK:'What’s next',ueBadge:'In development',ue:'Liam & Tim are rebuilding Rotterdam VII in Unreal Engine 5. With realistic graphics, the same characters and the story of container VII-007. The current version stays playable and keeps getting updates.',ue1:'Realistic characters',ue1p:'Barry, Bella and the rest, rebuilt as real people.',ue2:'A living city',ue2p:'Realistic lighting, weather and day and night.',ue3:'The same story',ue3p:'Container VII-007, 24 missions and your choice in the finale.',ue4:'Keep playing',ue4p:'Today’s version stays available to download here.',navStory:'Story',verK:'The story',verIntro:'One rainy evening, container VII-007 vanishes from a secure harbour. According to the authorities it’s an administrative error. In reality it holds secret documents, millions in dirty money and proof of corruption in the city government. And the disappearance ties together eight Rotterdammers who all have something to hide.',
 a1T:'Disappearance',a1:'Ome Kees recognises the traces of his old network. Barry gets a suspicious demolition job, Farmer Gerrit drove part of the transport and Henk the herring man ends up with a memory stick. Coincidence? No way.',
 a2T:'Everyone has something to hide',a2:'Bella smells her big chance. Fenna maps out the corrupt network. Officer Bram discovers the police themselves are involved, and enforcement officer Ilse spots something off during a routine check.',
 a3T:'Allies or traitors',a3:'All the puzzle pieces together are the key to the truth. You have to secure evidence, survive rivals and choose who to trust.',
 finT:'The finale: you choose',f1T:'Exposure',fin1:'Team up with your allies and expose the corrupt network.',or:'or',f2T:'Takeover',fin2:'Betray everyone and take over the underworld yourself.',
 verNote:'This story is coming to the game step by step, with more in every update.',

 lAge:'years',lArea:'Area',lLink:'In the story',lMis:'Missions (in development)',lSecret:'🤫 Secret: you’ll find out in the game.',lMore:'Read more',navTrailer:'Trailer',navChars:'Characters',navCity:'The city',navFeat:'Features',navDl:'Download',
 badge:'Early Access · Free',tag:'Everything can break',watch:'▶ Watch the trailer',dlFree:'⬇ Download free',
 trK:'Trailer',trH:'Welcome to the harbour city',
 c1K:'Character 01',c1:'Owner of demolition company Alles Kan Kapot, from Charlois. Impulsive, chaotic and terrible at planning. But need something wrecked? You call Barry. Until he gets the job of destroying a harbour container…',c1Q:'“If it doesn’t work, you just have to hit it harder!”',
 c2K:'Character 02',c2:'Barry’s wife and the brains behind Alles Kan Kapot. Bella handles the clients, the money and the plans. She wants more than demolition: her own business empire. And the missing container is her big chance.',c2Q:'“Barry, honey... that was our own van.”',
 cityK:'The city',cityH:'Your Rotterdam',city:'Drive through an open world full of towers, tilted houses, bridges and harbours. From sunrise to a city full of lights at night: you can go anywhere.',
 p1:'The skyline',p1s:'Towers, parks and the river, all open to explore',p2s:'The highest point in the city',p3s:'Living upside down',p4s:'The bridge at sunset',p5:'The night',p5s:'When the lights come on, things get exciting',
 fK:'Features',fH:'What you can do',
 f1:'A real story',f1p:'5 story missions against the Cheese King, with cutscenes.',f2:'Car radio',f2p:'4 stations with their own music and DJs. Switch with Q.',f3:'Garage',f3p:'Repairs, paint, rims, spoiler and nitro.',f4:'Weather & day/night',f4p:'Sun, rain, thunderstorms and fog, in a city that feels alive.',f5:'Phone',f5p:'Call a taxi, buy properties and start missions.',f6:'3 languages',f6p:'Play in Dutch, English or German.',
 dK:'Download',dH:'Play it now',dlWin:'⬇ Download for Windows',ver:'Version ',
 steps:'Double-click the file. Get a blue warning? Click <b>More info</b> → <b>Run anyway</b>. Rotterdam VII installs itself and puts a shortcut on your desktop. Updates arrive automatically after that.',
 reqGpu:'Any modern PC',disc:'Join the Discord for updates, tips and to play together!',
 ea:'Rotterdam VII is still in Early Access. We work on it every day to make the game complete and polished. Found a bug? Let us know on Discord!',rights:'All rights reserved'},
de:{ueK:'Was kommt',ueBadge:'In Entwicklung',ue:'Liam & Tim bauen Rotterdam VII neu in der Unreal Engine 5. Mit realistischer Grafik, denselben Figuren und der Story um Container VII-007. Die aktuelle Version bleibt spielbar und bekommt weiter Updates.',ue1:'Realistische Figuren',ue1p:'Barry, Bella und die anderen, nachgebaut als echte Menschen.',ue2:'Eine lebendige Stadt',ue2p:'Realistisches Licht, Wetter sowie Tag und Nacht.',ue3:'Dieselbe Story',ue3p:'Container VII-007, 24 Missionen und deine Wahl im Finale.',ue4:'Weiterspielen',ue4p:'Die aktuelle Version bleibt hier zum Download.',navStory:'Story',verK:'Die Story',verIntro:'An einem regnerischen Abend verschwindet Container VII-007 aus einem gesicherten Hafen. Laut den Behörden ein Verwaltungsfehler. In Wahrheit enthält er geheime Dokumente, Millionen an Schwarzgeld und Beweise für Korruption in der Stadtverwaltung. Und das Verschwinden verbindet acht Rotterdamer, die alle etwas zu verbergen haben.',
 a1T:'Verschwinden',a1:'Ome Kees erkennt die Spuren seines alten Netzwerks. Barry bekommt einen verdächtigen Abrissauftrag, Bauer Gerrit fuhr einen Teil des Transports und Heringsmann Henk bekommt einen USB-Stick in die Hände. Zufall? Niemals.',
 a2T:'Jeder hat etwas zu verbergen',a2:'Bella wittert ihre große Chance. Fenna deckt das korrupte Netzwerk auf. Polizist Bram entdeckt, dass die Polizei selbst beteiligt ist, und Ordnungshüterin Ilse sieht bei einer normalen Kontrolle etwas, das nicht stimmt.',
 a3T:'Verbündete oder Verräter',a3:'Alle Puzzleteile zusammen sind der Schlüssel zur Wahrheit. Du musst Beweise sichern, Rivalen überleben und entscheiden, wem du vertraust.',
 finT:'Das Finale: Du entscheidest',f1T:'Enthüllung',fin1:'Arbeite mit deinen Verbündeten zusammen und lass das korrupte Netzwerk auffliegen.',or:'oder',f2T:'Machtübernahme',fin2:'Verrate alle und übernimm selbst die Unterwelt.',
 verNote:'Diese Story kommt Schritt für Schritt ins Spiel, mit jedem Update mehr.',
 castK:'Figuren',castH:'Acht Rotterdamer. Ein Container.',cast:'Klick auf eine Figur, um ihre Geschichte zu lesen.',
 lAge:'Jahre',lArea:'Gebiet',lLink:'In der Story',lMis:'Missionen (in Entwicklung)',lSecret:'🤫 Geheimnis: Das erfährst du im Spiel.',lMore:'Mehr lesen',navTrailer:'Trailer',navChars:'Figuren',navCity:'Die Stadt',navFeat:'Features',navDl:'Download',
 badge:'Early Access · Kostenlos',tag:'Alles kann kaputt',watch:'▶ Trailer ansehen',dlFree:'⬇ Kostenlos laden',
 trK:'Trailer',trH:'Willkommen in der Hafenstadt',
 c1K:'Figur 01',c1:'Besitzer der Abrissfirma Alles Kan Kapot, aus Charlois. Impulsiv, chaotisch und schlecht im Planen. Aber muss etwas kaputt? Dann rufst du Barry. Bis er den Auftrag bekommt, einen Hafencontainer zu zerstören…',c1Q:'„Wenn’s nicht klappt, musst du einfach fester draufhauen!“',
 c2K:'Figur 02',c2:'Barrys Frau und das Gehirn hinter Alles Kan Kapot. Bella kümmert sich um Kunden, Geld und Pläne. Sie will mehr als Abriss: ihr eigenes Geschäftsimperium. Und der verschwundene Container ist ihre große Chance.',c2Q:'„Barry, Schatz... das war unser eigener Transporter.“',
 cityK:'Die Stadt',cityH:'Dein Rotterdam',city:'Fahr durch eine offene Welt voller Türme, Kipphäuser, Brücken und Häfen. Vom Sonnenaufgang bis zur Stadt voller Lichter bei Nacht: Du kannst überall hin.',
 p1:'Die Skyline',p1s:'Türme, Parks und der Fluss, alles offen zum Erkunden',p2s:'Der höchste Punkt der Stadt',p3s:'Wohnen auf dem Kopf',p4s:'Die Brücke bei Sonnenuntergang',p5:'Die Nacht',p5s:'Wenn die Lichter angehen, wird es spannend',
 fK:'Features',fH:'Was du tun kannst',
 f1:'Eine echte Story',f1p:'5 Story-Missionen gegen den Käsekönig, mit Zwischensequenzen.',f2:'Autoradio',f2p:'4 Sender mit eigener Musik und DJs. Wechseln mit Q.',f3:'Werkstatt',f3p:'Reparatur, Lack, Felgen, Spoiler und Nitro.',f4:'Wetter & Tag/Nacht',f4p:'Sonne, Regen, Gewitter und Nebel, in einer lebendigen Stadt.',f5:'Handy',f5p:'Ruf ein Taxi, kauf Immobilien und starte Missionen.',f6:'3 Sprachen',f6p:'Spiel auf Niederländisch, Englisch oder Deutsch.',
 dK:'Download',dH:'Jetzt spielen',dlWin:'⬇ Download für Windows',ver:'Version ',
 steps:'Doppelklicke auf die Datei. Kommt eine blaue Warnung? Klick auf <b>Weitere Informationen</b> → <b>Trotzdem ausführen</b>. Rotterdam VII installiert sich selbst und legt eine Verknüpfung auf deinem Desktop an. Updates kommen danach automatisch.',
 reqGpu:'Jeder moderne PC',disc:'Tritt dem Discord bei für Updates, Tipps und um zusammen zu spielen!',
 ea:'Rotterdam VII ist noch im Early Access. Es wird jeden Tag daran gearbeitet, das Spiel komplett und richtig gut zu machen. Einen Fehler gefunden? Sag es uns im Discord!',rights:'Alle Rechte vorbehalten'}};
let L;try{L=localStorage.getItem('r7lang')}catch(e){}L=(L||navigator.language||'nl').slice(0,2);if(!T[L])L='en';let ver='';
function show(){const t=T[L];document.documentElement.lang=L;
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t[e.dataset.t];if(v!=null)e.innerHTML=v;});
 document.getElementById('ver').textContent=ver?t.ver+ver+' · Early Access':'';
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));renderCast();}
const IMG=f=>'media/characters/'+encodeURIComponent(f);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderCast(){const g=document.getElementById('castgrid');if(!g||!window.R7_CHARS)return;const t=T[L];
 g.innerHTML=R7_CHARS.map((c,i)=>`<button class="cc rv in" style="--c:${c.col}" data-i="${i}"><img src="${IMG(c.img)}" alt="${esc(c.name)}" loading="lazy"><span class="more">${t.lMore} →</span><div class="lab"><b>${esc(c.name)}</b><span>${esc(c.role[L])}</span></div></button>`).join('');
 g.querySelectorAll('.cc').forEach(b=>b.onclick=()=>openChar(+b.dataset.i));
 const m2=document.getElementById('cmodal');if(m2&&m2.classList.contains('on'))openChar(cur);}
var cm=document.getElementById('cmodal'),cur=0;
function openChar(i){cur=i;const c=R7_CHARS[i],t=T[L];cm.style.setProperty('--c',c.col);
 document.getElementById('cart').innerHTML=`<img src="${IMG(c.img)}" alt="${esc(c.name)}">`;
 document.getElementById('cinfo').innerHTML=`<h3>${esc(c.name)}</h3><div class="role">${esc(c.role[L])}</div>
 <div class="facts"><span>${c.age} ${t.lAge}</span><span>📍 ${esc(c.area[L])}</span></div>
 <div class="q">${esc(c.quote[L])}</div><p>${esc(c.story[L])}</p>
 <div class="lk"><b>${t.lLink} · VII-007</b>${esc(c.link[L])}</div>
 <h4>${t.lMis}</h4><div class="ms">${c.missions.map(m=>`<div><b>${esc(m[0])}</b>${esc(m[1][L])}</div>`).join('')}</div>
 <div class="secret">${t.lSecret}</div>`;
 cm.classList.add('on');document.body.style.overflow='hidden';}
function closeChar(){cm.classList.remove('on');document.body.style.overflow='';}
document.getElementById('cx').onclick=closeChar;cm.onclick=e=>{if(e.target===cm)closeChar();};
addEventListener('keydown',e=>{if(!cm.classList.contains('on'))return;if(e.key==='Escape')closeChar();if(e.key==='ArrowRight')openChar((cur+1)%R7_CHARS.length);if(e.key==='ArrowLeft')openChar((cur+R7_CHARS.length-1)%R7_CHARS.length);});
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('r7lang',L)}catch(e){}show();});
show();
fetch('update.json',{cache:'no-store'}).then(r=>r.json()).then(u=>{if(u.app){ver=u.app;const url=u.appUrl||('https://github.com/liamdej0ng/rotterdam7/releases/download/v'+u.app+'/Rotterdam-VII-Setup-'+u.app+'.exe');document.getElementById('dlbtn').href=url;}show();}).catch(()=>{});
const nav=document.getElementById('nav');addEventListener('scroll',()=>nav.classList.toggle('solid',scrollY>60),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const m=document.getElementById('modal'),mv=document.getElementById('mv');
document.getElementById('watch').onclick=()=>{m.classList.add('on');mv.currentTime=0;mv.play().catch(()=>{});};
const close=()=>{m.classList.remove('on');mv.pause();};
document.getElementById('mx').onclick=close;m.onclick=e=>{if(e.target===m)close();};addEventListener('keydown',e=>{if(e.key==='Escape')close();});
const hv=document.querySelector('.hero video');hv.addEventListener('error',()=>hv.remove(),true);
</script>
