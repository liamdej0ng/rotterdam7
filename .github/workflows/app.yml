name: Bouw Rotterdam VII-app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node copy-assets.js
      - run: copy ..\dict.json app\dict.json
        shell: cmd
      - run: npx electron-builder --win --x64 --publish never
      - name: Release maken
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          F="dist/Rotterdam-VII-Setup-$V.exe dist/Rotterdam-VII-Setup-$V.exe.blockmap dist/latest.yml"
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" $F --clobber; else gh release create "v$V" $F --title "Rotterdam VII $V" --notes "Discord-status: je ziet nu 'Speelt Rotterdam VII' in Discord." --target "$GITHUB_SHA"; fi
